name: Test local mesh engine and browser logic
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.12', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Engine formats, topology, exports and isolated job workers
        run: python -m unittest discover -s tests -v
      - name: Browser options, previews, race safety and artifact paths
        run: node --test
      - name: Generate original fixtures
        run: python run.py demo --out ci-fixtures
      - name: Analyze closed and open geometry
        run: |
          python run.py analyze ci-fixtures/closed-cube.stl --out ci-closed
          python run.py analyze ci-fixtures/open-cube.stl --out ci-open
          python run.py repair ci-fixtures/repairable-vessel.stl --out ci-repair --fill-holes-mm 5 --samples 32
